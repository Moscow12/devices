agent:
  id: "weighbridge-001"
  name: "Main Weighbridge Agent"
  version: "1.0.0"
  heartbeat_interval: 60  # seconds

logging:
  level: "INFO"
  format: "json"
  file: "logs/agent.log"
  max_file_size: 10485760  # 10MB
  backup_count: 5
  console: true

api:
  base_url: "http://localhost:8000/api"
  timeout: 30
  retry:
    max_attempts: 5
    delay: 5
    backoff: 2
  circuit_breaker:
    failure_threshold: 5
    timeout: 60

buffer:
  enabled: true
  max_size: 10000
  flush_interval: 60  # seconds
  db_path: "storage/buffer.db"
  batch_size: 100

indicators:
  - id: "scale-001"
    name: "Main Truck Scale"
    type: "generic_ascii"
    enabled: true
    transport:
      type: "serial"
      port: "COM1"  # or /dev/ttyUSB0 for Linux
      baudrate: 9600
      bytesize: 8
      parity: "N"
      stopbits: 1
      timeout: 2
    parser:
      type: "generic_ascii"
      weight_pattern: '\d+\.?\d*'
      unit_pattern: 'kg|lb|ton'
      stable_indicator: 'ST'
    validation:
      min_weight: 0
      max_weight: 100000
      stable_required: true
    polling_interval: 1.0  # seconds

  # Example TCP/IP indicator
  # - id: "scale-002"
  #   name: "Secondary Scale"
  #   type: "mettler_toledo"
  #   enabled: false
  #   transport:
  #     type: "tcp"
  #     host: "192.168.1.100"
  #     port: 8001
  #     timeout: 5
  #   parser:
  #     type: "mettler_toledo"
  #   polling_interval: 0.5

monitoring:
  enabled: true
  metrics_port: 9090
  health_check_port: 8080
